name: Secret scan

# This repo is public and local dev shares the production database, so a
# committed credential is a production incident. gitleaks scans the commits in
# each push/PR (free for repos owned by a personal account; no license needed).
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
